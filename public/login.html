<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Ingest List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --line: #262626;
      --line-strong: #3a3a3a;
      --text: #f5f5f5;
      --text-2: #b8b8b8;
      --text-3: #6e6e6e;
      --accent: #5b8def;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
    }
    .wordmark {
      font-size: 18px;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .wordmark .wm-bold { font-weight: 700; }
    .wordmark .wm-slash { color: var(--text-3); margin: 0 2px; }
    .wordmark .wm-light { font-weight: 400; color: var(--text-2); }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      margin-top: 18px;
    }
    p.sub {
      font-size: 13px;
      color: var(--text-3);
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.12s;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 16px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      margin-top: 14px;
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">
      <span class="wm-bold">Ingest</span><span class="wm-slash">/</span><span class="wm-light">List</span>
    </div>
    <h1>Login</h1>
    <p class="sub">Bitte Passwort eingeben um fortzufahren.</p>
    <form id="login-form">
      <label for="pwd">Passwort</label>
      <input type="password" id="pwd" name="password" autocomplete="current-password" autofocus required>
      <button type="submit" id="submit-btn">Einloggen</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pwd').value }),
        });
        if (res.ok) {
          location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Login fehlgeschlagen';
      } catch (err) {
        errorEl.textContent = 'Netzwerkfehler';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Einloggen';
      }
    });
  </script>
</body>
</html>
